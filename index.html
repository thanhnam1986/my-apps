<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Apps - Ứng Dụng Của Tôi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            padding-top: 20px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 600px;
        }

        .app-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 160px;
        }

        .app-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .app-card:active {
            transform: scale(0.95);
        }

        .app-icon {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
        }

        .app-name {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .app-status {
            font-size: 12px;
            color: #999;
            font-weight: 500;
        }

        .app-card.coming-soon {
            opacity: 0.75;
            cursor: not-allowed;
        }

        .app-card.coming-soon:hover {
            transform: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .footer {
            text-align: center;
            color: white;
            padding: 20px;
            font-size: 14px;
            opacity: 0.9;
            margin-top: 30px;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .apps-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }

            .app-card {
                min-height: 150px;
                padding: 15px;
            }

            .app-icon {
                font-size: 40px;
                margin-bottom: 10px;
            }

            .app-name {
                font-size: 13px;
            }

            .header h1 {
                font-size: 24px;
            }
        }

        @media (max-width: 320px) {
            .apps-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .app-card {
                min-height: 140px;
                padding: 12px;
            }

            .app-icon {
                font-size: 36px;
                margin-bottom: 8px;
            }

            .app-name {
                font-size: 12px;
            }

            .header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📱 My Apps</h1>
        <p>Ứng dụng của tôi</p>
    </div>

    <div class="container">
        <div class="apps-grid">
            <!-- GPS App -->
            <a href="gps/" class="app-card">
                <span class="app-icon">📍</span>
                <div class="app-name">Đo GPS</div>
                <div class="app-status">Hoạt động</div>
            </a>

       
            <!-- KHKT Tool -->
            <div class="app-card coming-soon">
                <span class="app-icon">📋</span>
                <div class="app-name">Tool KHKT</div>
                <div class="app-status">Sắp có</div>
            </div>

            <!-- Tính Toán App -->
            <a href="tinh-toan/" class="app-card">
                <span class="app-icon">📐</span>
                <div class="app-name">Tính toán kỹ thuật</div>
                <div class="app-status">Hoạt động</div>
            </a>
        </div>
    </div>

    <div class="footer">
        <p>Made by Thành Nam </p>
    </div>
</body>
</html>
